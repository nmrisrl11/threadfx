<!doctype html>
<html lang="en" class="scroll-smooth">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="%APP_THEME_COLOR%" />

		<!-- Synchronous Anti-FOUC Theme Initialization (Guarantees zero flash on load) -->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem("threadfx_theme") || "dark";
					var isSystemDark =
						window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
					var isDark = stored === "dark" || (stored === "system" && isSystemDark);
					var root = document.documentElement;
					root.classList.toggle("dark", isDark);
					root.classList.toggle("light", !isDark);
					root.setAttribute("data-theme", isDark ? "dark" : "light");
					var meta = document.querySelector('meta[name="color-scheme"]');
					if (meta) meta.setAttribute("content", stored === "system" ? "light dark" : stored);
				} catch (e) {}
			})();
		</script>

		<!-- Primary SEO Metadata -->
		<title>%APP_TITLE%</title>
		<meta name="description" content="%APP_DESCRIPTION%" />
		<meta name="keywords" content="%APP_KEYWORDS%" />
		<meta name="author" content="%APP_AUTHOR%" />
		<meta name="creator" content="%APP_CREATOR%" />
		<meta name="publisher" content="%APP_PUBLISHER%" />
		<meta
			name="robots"
			content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
		/>
		<meta
			name="googlebot"
			content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
		/>
		<meta name="format-detection" content="telephone=no" />
		<link rel="canonical" href="https://%APP_URL%/" />

		<!-- Discoverability, Sitemaps & LLM Context -->
		<link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
		<link rel="alternate" type="text/plain" href="/llms.txt" title="LLM Project Context" />

		<!-- Web Application & Mobile Capabilities -->
		<meta name="application-name" content="%APP_NAME%" />
		<meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />

		<!-- Icons & Webmanifest -->
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/icons/16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/180.png" />
		<link rel="manifest" href="/site.webmanifest" />

		<!-- Open Graph Protocol -->
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://%APP_URL%/" />
		<meta property="og:site_name" content="%APP_NAME%" />
		<meta property="og:title" content="%APP_TITLE%" />
		<meta property="og:description" content="%APP_DESCRIPTION%" />
		<meta property="og:image" content="https://%APP_URL%/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="%APP_OG_IMAGE_ALT%" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="%TWITTER_SITE%" />
		<meta name="twitter:creator" content="%TWITTER_CREATOR%" />
		<meta name="twitter:title" content="%APP_TITLE%" />
		<meta name="twitter:description" content="%APP_DESCRIPTION%" />
		<meta name="twitter:image" content="https://%APP_URL%/og-image.png" />

		<!-- Structured Data: Schema.org Graph -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@graph": [
					{
						"@type": "SoftwareApplication",
						"@id": "https://%APP_URL%/#software",
						"name": "%APP_FULL_NAME%",
						"url": "https://%APP_URL%/",
						"image": "https://%APP_URL%/og-image.png",
						"description": "%APP_SHORT_DESCRIPTION%",
						"applicationCategory": "BrowserExtension",
						"operatingSystem": "Chromium browsers (Google Chrome, Brave, Microsoft Edge, Arc)",
						"softwareVersion": "%APP_VERSION%",
						"offers": {
							"@type": "Offer",
							"price": "0.00",
							"priceCurrency": "USD",
							"availability": "https://schema.org/InStock"
						},
						"author": {
							"@type": "Person",
							"name": "%AUTHOR_NAME%",
							"url": "%AUTHOR_URL%"
						},
						"downloadUrl": "https://%APP_URL%/download",
						"license": "%LICENSE_URL%"
					},
					{
						"@type": "WebSite",
						"@id": "https://%APP_URL%/#website",
						"url": "https://%APP_URL%/",
						"name": "%APP_NAME%",
						"description": "%APP_DESCRIPTION%",
						"publisher": {
							"@type": "Person",
							"name": "%AUTHOR_NAME%",
							"url": "%AUTHOR_URL%"
						}
					},
					{
						"@type": "FAQPage",
						"@id": "https://%APP_URL%/#faq",
						"mainEntity": [
							{
								"@type": "Question",
								"name": "What is ThreadFX?",
								"acceptedAnswer": {
									"@type": "Answer",
									"text": "ThreadFX is an open-source browser extension that brings zero-latency procedural audio synthesis, visual particle bursts, and tactile micro-motion to social threads, launching with flagship support for Threads."
								}
							},
							{
								"@type": "Question",
								"name": "Is ThreadFX free and open source?",
								"acceptedAnswer": {
									"@type": "Answer",
									"text": "Yes, ThreadFX is 100% free and open source under the MIT License. The code is available on GitHub."
								}
							},
							{
								"@type": "Question",
								"name": "Does ThreadFX download external sound files?",
								"acceptedAnswer": {
									"@type": "Answer",
									"text": "No. ThreadFX strictly enforces a Zero External Audio Files policy. All sound effects are generated procedurally in-memory via the native browser Web Audio API and ZzFX."
								}
							},
							{
								"@type": "Question",
								"name": "Does ThreadFX collect or track any user data?",
								"acceptedAnswer": {
									"@type": "Answer",
									"text": "No. ThreadFX requires minimal permissions (sidePanel, storage) and operates entirely locally on your device with zero telemetry or network tracking."
								}
							},
							{
								"@type": "Question",
								"name": "Which web browsers are supported by ThreadFX?",
								"acceptedAnswer": {
									"@type": "Answer",
									"text": "ThreadFX supports all modern Chromium-based desktop browsers including Google Chrome, Brave, Microsoft Edge, and Arc."
								}
							}
						]
					}
				]
			}
		</script>

		%REACT_SCAN%
	</head>

	<body class="bg-background text-foreground">
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>

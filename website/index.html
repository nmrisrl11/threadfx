<!doctype html>
<html lang="en" class="dark scroll-smooth" style="color-scheme: dark; background-color: #080808">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="%APP_THEME_COLOR%" />

		<!-- Anti-FOUC dark background guarantee -->
		<style>
			:root,
			html,
			body {
				color-scheme: dark !important;
				background-color: #080808 !important;
				color: #f3f5f7 !important;
			}
		</style>
		<script>
			document.documentElement.classList.add("dark");
			document.documentElement.style.colorScheme = "dark";
		</script>

		<!-- Primary SEO Metadata -->
		<title>%APP_TITLE%</title>
		<meta name="description" content="%APP_DESCRIPTION%" />
		<meta name="keywords" content="%APP_KEYWORDS%" />
		<meta name="author" content="%APP_AUTHOR%" />
		<meta name="creator" content="%APP_CREATOR%" />
		<meta name="publisher" content="%APP_PUBLISHER%" />
		<link rel="canonical" href="https://%APP_URL%/" />

		<!-- Icons & Webmanifest -->
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/icons/16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/180.png" />
		<link rel="manifest" href="/site.webmanifest" />

		<!-- Open Graph Protocol -->
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://%APP_URL%/" />
		<meta property="og:site_name" content="%APP_NAME%" />
		<meta property="og:title" content="%APP_TITLE%" />
		<meta property="og:description" content="%APP_DESCRIPTION%" />
		<meta property="og:image" content="https://%APP_URL%/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="%APP_OG_IMAGE_ALT%" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="%TWITTER_SITE%" />
		<meta name="twitter:creator" content="%TWITTER_CREATOR%" />
		<meta name="twitter:title" content="%APP_TITLE%" />
		<meta name="twitter:description" content="%APP_DESCRIPTION%" />
		<meta name="twitter:image" content="https://%APP_URL%/og-image.png" />

		<!-- Structured Data: Schema.org SoftwareApplication -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareApplication",
				"@id": "https://%APP_URL%/#software",
				"name": "%APP_FULL_NAME%",
				"url": "https://%APP_URL%/",
				"image": "https://%APP_URL%/og-image.png",
				"description": "%APP_SHORT_DESCRIPTION%",
				"applicationCategory": "BrowserExtension",
				"operatingSystem": "Chromium browsers (Google Chrome, Brave, Microsoft Edge, Arc)",
				"softwareVersion": "%APP_VERSION%",
				"offers": {
					"@type": "Offer",
					"price": "0.00",
					"priceCurrency": "USD",
					"availability": "https://schema.org/InStock"
				},
				"author": {
					"@type": "Person",
					"name": "%AUTHOR_NAME%",
					"url": "%AUTHOR_URL%"
				},
				"downloadUrl": "https://%APP_URL%/download",
				"license": "%LICENSE_URL%"
			}
		</script>

		%REACT_SCAN%
	</head>

	<body
		class="dark"
		style="color-scheme: dark; background-color: #080808; color: #f3f5f7; margin: 0"
	>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="silver-grad" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="bezel-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="dot-grad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="#0C0D0E" stroke="url(#bezel-grad)" stroke-width="1.5" />
  
  <!-- Subtle Inner Surface -->
  <rect x="4" y="4" width="40" height="40" rx="9" fill="#131416" stroke="#1E2024" stroke-width="0.8" />

  <!-- Thread Speech Bubble Ribbon Loop -->
  <path d="M 24 13 C 31.5 13 36.5 17.5 36.5 23.5 C 36.5 29.5 31.5 34 24 34 C 21.8 34 20 33.6 18.2 32.8 L 15.5 35.5 C 14.8 36.2 13.8 35.8 14 34.8 L 14.6 31.8 C 12.8 29.8 11.5 26.8 11.5 23.5 C 11.5 17.5 16.5 13 24 13 Z" 
        stroke="url(#silver-grad)" 
        stroke-width="2.8" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Ribbon Twist Highlight at Tail Junction -->
  <path d="M 18.5 32.8 C 17 31.5 15.8 29.8 15.2 28.5" 
        stroke="url(#silver-grad)" 
        stroke-width="1.6" 
        stroke-linecap="round" />

  <!-- 3 Tactile Chat Studs / Dots -->
  <circle cx="19" cy="23.5" r="1.6" fill="url(#dot-grad)" />
  <circle cx="24" cy="23.5" r="1.6" fill="url(#dot-grad)" />
  <circle cx="29" cy="23.5" r="1.6" fill="url(#dot-grad)" />
</svg>

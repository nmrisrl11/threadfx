<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="silver-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="bezel-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="#0C0D0E" stroke="url(#bezel-grad)" stroke-width="1.5" />
  
  <!-- Subtle Inner Groove -->
  <rect x="4" y="4" width="40" height="40" rx="9" fill="#141517" stroke="#1E2024" stroke-width="1" />

  <!-- The Threads Loop Emblem -->
  <path d="M 28 17 C 26 14.5 22.5 13.5 19 15 C 15 16.8 13 21 13 25 C 13 30 17 34 22 34 C 26 34 29 32 30 28.5 C 30.5 26.5 30 24 28.5 22.5 C 27 21 24.5 21 23 22 C 21 23.5 20.5 26 21.5 27.5 C 22.2 28.5 23.8 28.8 24.8 28 C 26.5 26.5 26.5 23 25 20.5 C 23.5 18 19 17.5 17 21" 
        stroke="url(#silver-grad)" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 3 Acoustic Shockwave Arcs -->
  <path d="M 33 20 C 34.5 22 34.5 26 33 28" 
        stroke="url(#silver-grad)" 
        stroke-width="2.2" 
        stroke-linecap="round" />
  <path d="M 36.5 17.5 C 39 21 39 27 36.5 30.5" 
        stroke="url(#silver-grad)" 
        stroke-width="2.2" 
        stroke-linecap="round" />
  <path d="M 40 15 C 43.5 20 43.5 28 40 33" 
        stroke="url(#silver-grad)" 
        stroke-width="2.2" 
        stroke-linecap="round" />
</svg>
